    label: "Person"
  - id: "schema:Organization"
    label: "Organization"
  - id: "schema:ItemList"
    label: "List"
  - id: "schema:SoftwareApplication"
    label: "Software Application"
  - id: "schema:Event"
    label: "Event"
  - id: "schema:Place"
    label: "Place"
  - id: "schema:Country"
    label: "Country"
